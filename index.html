<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Drone Range: fly and shoot, in your browser</title>
    <meta name="description" content="An open-source drone flight and combat simulator. Fly any drone you can describe in a JSON file through five environments and seven missions. Weapons, sensors and physics included." />
    <meta name="theme-color" content="#0E1621" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E1621'/%3E%3Cpath d='M32 10c7 9 7 35 0 44c-7-9-7-35 0-44zM10 32c9-7 35-7 44 0c-9 7-35 7-44 0z' fill='none' stroke='%23FF6A2B' stroke-width='3.5'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23FF6A2B'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('range.theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Drone Range needs JavaScript: the whole simulator runs in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
